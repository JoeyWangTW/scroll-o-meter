# Pointing / mouse
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Legacy 8-bit wheel reports — iOS pairs and consumes these reliably.
# Re-enable if iOS support for high-res scroll improves.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Persistence for the scroll counter
CONFIG_SETTINGS=y
CONFIG_NVS=y

# Optional: useful when iterating
# CONFIG_ZMK_USB_LOGGING=y
