# Match the working iphone-scroll-encoder conf: ZMK_MOUSE alone gives
# the legacy 8-bit wheel HID report iOS consumes (it auto-enables
# ZMK_POINTING).
CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Rotary encoder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Persistence for the scroll counter
CONFIG_SETTINGS=y
CONFIG_NVS=y

# DIAGNOSTIC: poll kscan instead of using GPIO interrupts. If the
# stock interrupt-driven path is somehow not picking up state changes
# on this hardware, polling will. Adds power draw (small, since the
# default poll interval is 10ms when idle) but is purely a test toggle.
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# DIAGNOSTIC: USB CDC ACM logging. Plug into Mac, open
#   screen /dev/tty.usbmodem* 115200
# to see boot logs (kscan init, EC11 init, BT events, etc.)
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_LOGGING=y
